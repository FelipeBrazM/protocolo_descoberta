include omnetpp.ini

[Config BatteryBase]
*.manager.moduleType = "batteryTruck=org.car2x.veins.nodes.Car *=org.car2x.veins.nodes.Car"
*.manager.moduleName = "batteryTruck=truck *=node"
*.manager.moduleDisplayString = "batteryTruck='i=veins/node/truck' *='i=veins/node/car'"
*.truck[*].applType = "BatteryTruckApp"
*.truck[*].veinsmobility.x = 0
*.truck[*].veinsmobility.y = 0
*.truck[*].veinsmobility.z = 0
*.truck[*].nic.phy80211p.decider = xmldoc("../veins-5.3.1/examples/veins/config.xml")
*.truck[*].nic.phy80211p.analogueModels = xmldoc("../veins-5.3.1/examples/veins/config.xml")
*.manager.launchConfig = xmldoc("sumo/battery_minimal.launchd.xml")
cmdenv-express-mode = false
cmdenv-event-banners = false
**.appl.cmdenv-log-level = info
**.cmdenv-log-level = warn
sim-time-limit = 1800s
*.node[*].appl.initialBattery = 20
*.node[*].appl.consumptionRate = 0
output-scalar-file = results/battery/${configname}-${runnumber}.sca
output-vector-file = results/battery/${configname}-${runnumber}.vec

*.truck[*].nic.phy80211p.usePropagationDelay = true
*.truck[*].nic.phy80211p.txPower = 20mW
*.truck[*].nic.phy80211p.bitrate = 6Mbps
*.truck[*].nic.phy80211p.minPowerLevel = -110dBm
*.truck[*].nic.phy80211p.useNoiseFloor = true
*.truck[*].nic.phy80211p.noiseFloor = -98dBm
*.truck[*].nic.mac1609_4.txPower = 20mW

[Config BatteryMinimal]
extends = BatteryBase

[Config BatteryMultiple]
extends = BatteryBase
*.manager.launchConfig = xmldoc("sumo/battery_multiple.launchd.xml")
*.node[1].appl.initialBattery = 10
*.node[*].appl.initialBattery = 50

[Config BatterySimultaneous]
extends = BatteryBase
*.manager.launchConfig = xmldoc("sumo/battery_multiple.launchd.xml")

[Config BatteryInsufficient]
extends = BatteryBase
*.truck[*].appl.initialBattery = 5

[Config BatteryNoMeeting]
extends = BatteryBase
**.appl.meetingDistance = 1m

[Config BatteryMultihop]
extends = BatteryBase
sim-time-limit = 60s
*.manager.launchConfig = xmldoc("sumo/battery_multihop.launchd.xml")
# Controlled radio connectivity cutoff, independent of logical meeting distance.
*.connectionManager.maxInterfDist = 100m
*.node[1].appl.initialBattery = 10
*.node[*].appl.initialBattery = 50

[Config BatteryHopLimit]
extends = BatteryMultihop
**.appl.maxHops = 1

[Config BatteryExpiredFrames]
extends = BatteryMultihop
**.appl.messageTtl = 1us

[Config BatteryUrban]
extends = BatteryBase
*.manager.launchConfig = xmldoc("sumo/battery_urban.launchd.xml")
sim-time-limit = 1800s
*.node[*].appl.initialBattery = -1
*.node[*].appl.consumptionRate = 0.001

[Config BatteryApproach]
extends = BatteryBase
*.manager.launchConfig = xmldoc("sumo/battery_approach.launchd.xml")

[Config BatteryDepleted]
extends = BatteryBase
*.truck[*].appl.initialBattery = 20

[Config BatteryRateLimited]
extends = BatteryBase
*.node[*].appl.targetBatteryPercent = 75

[Config BatteryConfirmation]
extends = BatteryBase
*.manager.launchConfig = xmldoc("sumo/battery_confirmation.launchd.xml")

[Config BatteryResponseTimeout]
extends = BatteryMinimal
*.truck[*].appl.messageTtl = 1us
sim-time-limit = 30s
