[General]
network = Grid9x9Scenario

sim-time-limit = 600s

*.playgroundSizeX = 2250m
*.playgroundSizeY = 2250m
*.playgroundSizeZ = 50m

*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("sumo/grid9x9.launchd.xml")

*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false

*.node[*].applType = "TraCIDemo11p"

*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0

*.node[*].nic.phy80211p.usePropagationDelay = true
*.node[*].nic.phy80211p.txPower = 20mW
*.node[*].nic.phy80211p.bitrate = 6Mbps
*.node[*].nic.phy80211p.minPowerLevel = -110dBm
*.node[*].nic.phy80211p.useNoiseFloor = true
*.node[*].nic.phy80211p.noiseFloor = -98dBm

*.node[*].nic.mac1609_4.txPower = 20mW

*.node[*].nic.phy80211p.decider = xmldoc("../veins-5.3.1/examples/veins/config.xml")
*.node[*].nic.phy80211p.analogueModels = xmldoc("../veins-5.3.1/examples/veins/config.xml")
